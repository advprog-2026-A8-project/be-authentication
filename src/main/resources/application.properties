spring.application.name=be-authentication

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/be_authentication}
spring.datasource.driverClassName=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Rate Limiting
rate.limit.login=${RATE_LIMIT_LOGIN:5}
rate.limit.register=${RATE_LIMIT_REGISTER:3}

# Actuator
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=when-authorized
