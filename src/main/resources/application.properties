spring.application.name=be-authentication

spring.datasource.url=${DB_URL:jdbc:h2:mem:authdb}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# JWT Configuration
jwt.secret=${JWT_SECRET:DefaultSecretKeyUntukDevelopmentLokalYangSangatPanjangSekali123!@#}
jwt.expiration=${JWT_EXPIRATION:86400000}